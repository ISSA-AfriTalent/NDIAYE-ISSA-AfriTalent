<!DOCTYPE html>
<html lang="fr">

<head>
  <!-- metadonnee de la page -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- titre affiche dans longlet du navigateur -->
  <title>AfriTalent — Accueil</title>
  <!-- framework bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- feuille de style personnalisee -->
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <!-- barre de navigation -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <!-- logo et nom du site -->
      <a class="navbar-brand d-flex align-items-center" href="index.html">
        <img src="images/WhatsApp Image 2026-06-18 at 19.26.35.jpeg" alt="AfriTalent" width="45" height="45"
          class="me-2">
        AfriTalent
      </a>
      <!-- bouton menu mobile -->
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu"
        aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <!-- liens de navigation -->
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link active" href="index.html">Accueil</a></li>
          <li class="nav-item"><a class="nav-link" href="freelances.html">Freelances</a></li>
          <li class="nav-item"><a class="nav-link" href="tarifs.html">Tarifs</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">A
              propos</a></li>
          <li class="nav-item"><a class="nav-link" href="Blog">Blog</a></li>
          <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
        </ul>
      </div>
    </div>
  </nav>
  <!-- contenu principal -->
  <main>
    <!-- section contact -->
    <section class="container my-5">
      <!-- titre de la page -->
      <h1 class="text-center mb-4">Contactez-nous</h1>
      <!-- formulaire du contact -->
      <form id="contactForm" novalidate>
        <!-- ligne nom et prenom -->
        <div class="row">
          <!-- champ nom -->
          <div class="col-md-6 mb-3">
            <input type="text" id="nom" class="form-control" placeholder="Nom">
            <small class="text-danger" id="errorNom"></small>
          </div>
          <!-- champ prenom -->
          <div class="col-md-6 mb-3">
            <input type="text" id="prenom" class="form-control" placeholder="Prénom">
            <small class="text-danger" id="errorPrenom"></small>
          </div>
        </div>
        <!-- champ email -->
        <div class="mb-3">
          <input type="email" id="email" class="form-control" placeholder="Email">
          <small class="text-danger" id="errorEmail"></small>
        </div>
        <!-- liste deroulante Sujet -->
        <div class="mb-3">
          <label for="sujet" class="form-label">Sujet</label>
          <select id="sujet" class="form-select">
            <option value="">Choisir un sujet</option>
            <option>Demande</option>
            <option>Support</option>
            <option>Autre</option>
          </select>
          <small class="text-danger" id="errorSujet"></small>
        </div>
        <!-- zone de saisie du message -->
        <div class="mb-3">
          <textarea id="message" class="form-control" rows="4" placeholder="Message"></textarea>
          <small class="text-danger" id="errorMessage"></small>
        </div>
        <!-- bouton denvoi -->
        <button type="submit" class="btn btn-primary">Envoyer</button>
        <!-- message de succes apres validation -->
        <p id="successMsg" class="text-success text-center mt-3"></p>
      </form>
    </section>
  </main>
  <!-- pied de page -->
  <footer>
    <!-- contenu du footer a ajouter -->
  </footer>
  <!-- scripts JAVASCRIPT -->

  <!-- bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- script personnalisee -->
  <script src="js/main.js"></script>
</body>

</html>
